services:
  loki:
    image: grafana/loki:latest
    container_name: minigrafana-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - minigrafana-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: minigrafana-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - minigrafana-net
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki_data:
  grafana_data:

networks:
  minigrafana-net:
    name: minigrafana-net
    driver: bridge
