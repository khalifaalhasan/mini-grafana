services:
  postgresql:
    image: postgres:17-alpine
    container_name: minigrafana-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minigrafana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minigrafanapassword}
      POSTGRES_DB: ${POSTGRES_DB:-db_mini_grafana}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - minigrafana-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minigrafana} -d ${POSTGRES_DB:-db_mini_grafana}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  minigrafana-net:
    name: minigrafana-net
    driver: bridge