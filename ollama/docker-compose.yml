services:
  ollama:
    image: ollama/ollama:latest
    container_name: minigrafana-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_ORIGINS: "${OLLAMA_ORIGINS:-*}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-24h}"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - minigrafana-net
      - proxy_network
    # Uncomment blok di bawah jika ingin menggunakan percepatan GPU NVIDIA (memerlukan nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  minigrafana-net:
    name: minigrafana-net
    driver: bridge
  proxy_network:
    name: proxy_network
    external: true
