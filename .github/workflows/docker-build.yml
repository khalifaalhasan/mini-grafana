name: Docker CI — Build Validation

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "src/**"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "src/**"

jobs:
  docker-build-test:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally (Smoke Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mini-grafana-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
