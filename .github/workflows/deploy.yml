name: CD — Deploy & Database Migration

on:
  push:
    branches: [ "main", "production" ]
  workflow_dispatch: # Memungkinkan trigger deployment secara manual dari GitHub Actions UI

jobs:
  deploy-to-production:
    name: Deploy to Server & Run Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy & Execute DB Migrations via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            echo "=========================================================="
            echo " [1/5] Masuk ke direktori aplikasi & Git Pull"
            echo "=========================================================="
            cd /home/${{ secrets.SERVER_USER }}/mini-grafana || exit 1
            git fetch --all
            git reset --hard origin/main

            echo "=========================================================="
            echo " [2/5] Menulis konfigurasi production .env dari Secrets"
            echo "=========================================================="
            cat <<EOF > .env
            NODE_ENV=production
            PORT=${{ secrets.PORT || '3000' }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            LOKI_URL=${{ secrets.LOKI_URL }}
            OLLAMA_URL=${{ secrets.OLLAMA_URL }}
            OLLAMA_DEFAULT_MODEL=${{ secrets.OLLAMA_DEFAULT_MODEL || 'llama3' }}
            EOF
            chmod 600 .env

            echo "=========================================================="
            echo " [3/5] Membangun Docker Image untuk NestJS Backend"
            echo "=========================================================="
            docker build -t mini-grafana-backend:latest .

            echo "=========================================================="
            echo " [4/5] Menjalankan Database Migrations via Drizzle ORM"
            echo "=========================================================="
            # Menjalankan migrasi Drizzle secara terisolasi ke database production
            docker run --rm --network minigrafana-net --env-file .env mini-grafana-backend:latest bun run db:migrate

            echo "=========================================================="
            echo " [5/5] Merestart Container Aplikasi Backend"
            echo "=========================================================="
            docker compose up -d --force-recreate
            echo "✅ Deployment dan Migrasi Database selesai!"
